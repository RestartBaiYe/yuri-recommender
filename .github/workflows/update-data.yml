name: Update AniList data

# 每周一 03:00 UTC（北京时间周一 11:00）自动同步 AniList 数据；
# 也可在 Actions 页面手动触发（workflow_dispatch）。

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest AniList data
        run: node scripts/fetch.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime.json data/meta.json
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 同步 AniList 数据 $(date -u +%Y-%m-%d)"
            git push
          fi
